name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, style and tests (PHP 8.5)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_sqlite, sqlite3, mbstring
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check autoload
        run: composer dump-autoload --optimize --strict-psr

      - name: PHP syntax check (every tracked PHP file)
        run: |
          status=0
          for file in $(git ls-files '*.php'); do
            php -l "$file" > /dev/null || status=1
          done
          exit $status

      - name: Check strict_types headers
        run: |
          missing=0
          for file in $(git ls-files '*.php'); do
            if ! head -2 "$file" | grep -q 'declare(strict_types=1)'; then
              echo "Missing strict_types: $file"
              missing=$((missing + 1))
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Check chapter manifest
        run: php bin/check-chapters.php

      - name: Mago lint
        run: composer lint

      - name: Pest
        run: composer test
