<!DOCTYPE html>
<html lang="en">

<!-- Code lane: GitHub-light-styled view of a repo file, fetched from GitHub raw,
     narrated lines highlighted, with an eased smooth-scroll to them on load.
     ?f=01-Simple/public/index.php&hl=18-22   (hl optional: N or N-M) -->
<head>
<meta charset="utf-8">
<title>SPE code</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
  /* GitHub-light palette; normal editor sizes (the browser's own zoom is the
     only zoom applied on top). */
  :root { color-scheme: light; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { font: 16px/1.6 "JetBrains Mono", "DejaVu Sans Mono", monospace; padding: 28px 44px; color: #1f2328; }
  .bar { color: #656d76; font-size: 14px; margin-bottom: 18px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #d0d7de; padding-bottom: 14px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #ff5f56; box-shadow: 18px 0 #ffbd2e, 36px 0 #27c93f; margin-right: 40px; }
  .code { display: table; border-collapse: collapse; width: 100%; }
  .line { display: table-row; }
  .ln { display: table-cell; text-align: right; color: #8c959f; user-select: none; padding: 0 24px 0 0; white-space: nowrap; width: 1%; }
  .src { display: table-cell; white-space: pre; }
  .line.hl { background: #fff8c5; }             /* GitHub's line-highlight yellow */
  .line.hl .ln { color: #59636e; box-shadow: inset 3px 0 #d4a72c; }
  .hljs { background: transparent; }
</style>
</head>
<body>
<div class="bar"><span class="dot"></span><span id="path"></span></div>
<div class="code" id="code"></div>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const f = q.get('f') || '01-Simple/public/index.php';
  const hl = (q.get('hl') || '').split('-').map(Number);
  const [a, b] = hl.length === 2 ? hl : [hl[0], hl[0]];
  document.getElementById('path').textContent = 'spe/' + f;

  const src = await (await fetch('https://raw.githubusercontent.com/markc/spe/main/' + f)).text();
  const lang = f.endsWith('.php') ? 'php' : f.endsWith('.json') ? 'json' : f.endsWith('.sql') ? 'sql' : 'plaintext';

  const code = document.getElementById('code');
  src.replace(/\n$/, '').split('\n').forEach((line, i) => {
    const n = i + 1;
    const row = document.createElement('div');
    row.className = 'line' + (a && n >= a && n <= b ? ' hl' : '');
    const g = document.createElement('span'); g.className = 'ln'; g.textContent = n;
    const s = document.createElement('span'); s.className = 'src';
    s.innerHTML = line ? hljs.highlight(line, { language: lang }).value : '&nbsp;';
    row.append(g, s); code.appendChild(row);
  });

  // Eased smooth-scroll to the highlighted lines (real motion for the capture).
  const first = code.querySelector('.line.hl');
  if (first) {
    const target = Math.max(0, first.offsetTop - innerHeight * 0.4);
    const start = pageYOffset, dist = target - start, dur = 1600, t0 = performance.now();
    const ease = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
    const step = (now) => {
      const p = Math.min(1, (now - t0) / dur);
      scrollTo(0, start + dist * ease(p));
      if (p < 1) requestAnimationFrame(step); else document.body.dataset.ready = '1';
    };
    requestAnimationFrame(step);
  } else {
    document.body.dataset.ready = '1';
  }
})();
</script>
</body>
</html>
